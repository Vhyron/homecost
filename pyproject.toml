[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "homecost"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.4.3",
]

[project.scripts]
homecost = "homecost.cli:main"

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
